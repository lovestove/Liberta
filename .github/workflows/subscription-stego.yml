name: Subscription Stego Images

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packer dependencies
        run: python -m pip install cryptography

      - name: Randomize hourly start
        run: |
          python - <<'PY'
          import random, time
          time.sleep(random.randint(0, 600))
          PY

      - name: Pack subscriptions into encrypted PNG
        env:
          LIBERTA_STEGO_KEY: ${{ secrets.LIBERTA_STEGO_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python tools/stego_pack.py --out build/stego

      - name: Upload phone-download artifact
        uses: actions/upload-artifact@v4
        with:
          name: liberta-stego-images
          path: build/stego
          retention-days: 7
